apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskly-deployment
  namespace: taskly-staging

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskly

  template:
    metadata:
      labels:
        app: taskly

    spec:
      containers:
        - name: taskly-container

          image: tasklyacryogesh.azurecr.io/taskly:IMAGE_TAG

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: taskly-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-secrets
                  key: DB1_URL

            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: taskly-secrets
                  key: REDIS_URL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL